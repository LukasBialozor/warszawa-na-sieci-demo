# Publikacja gry na GitHub Pages po kazdym pushu na glowna galaz.
# Ten plik musi lezec w .github/workflows/deploy-pages.yml (skopiuj go tam, np. przez "Add file" na GitHubie).
# Wlaczenie: Settings -> Pages -> Source: "GitHub Actions". W repozytorium prywatnym (Pages wymaga wtedy
# platnego planu) zadania sa pomijane - ruszaja same po zmianie widocznosci na publiczna.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
